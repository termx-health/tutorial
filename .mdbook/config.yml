# mdbook site configuration — https://github.com/helex-solutions/mdbook
site:
  title: TermX tutorial
  description: Guide to the TermX terminology, wiki and modelling platform.
  lang: en

source:
  format: termx            # TermX Wiki export
  meta: source             # space.json + pages.json + resources/ + attachments/
  pages: source/pages      # page markdown

# FHIR terminology server for expanding {{csc:}}/{{vsc:}} at build time.
tx-server: https://dev.termx.org/api/fhir

# API reference. Both documents are public — no authentication is configured, so
# the try-it console sends unauthenticated requests (protected TermX endpoints
# will answer 401, the FHIR read endpoints work as-is).
openapi:
  specs:
    termx: https://dev.termx.org/api/swagger/termx.yml
    termx-fhir: https://dev.termx.org/api/fhir-swagger
  tryIt: true

theme:
  skin: helex

search: true

# Site footer, shown on every page (both fields allow inline HTML/links).
footer:
  message: Guide to the TermX terminology, wiki &amp; modelling platform
  copyright: >-
    © 2026 <a href="https://termx.org">TermX</a> · Built with
    <a href="https://github.com/helex-solutions/mdbook">mdbook</a>
