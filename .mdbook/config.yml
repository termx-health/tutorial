# mdbook site configuration — https://github.com/igorboss/mdbook
site:
  title: TermX tutorial
  description: Guide to the TermX terminology, wiki and modelling platform.
  lang: en

source:
  format: termx            # TermX Wiki export
  meta: source             # space.json + pages.json + resources/ + attachments/
  pages: source/pages      # page markdown

# FHIR terminology server for expanding {{csc:}}/{{vsc:}} at build time.
tx-server: https://dev.termx.org/api/fhir

theme:
  skin: helex

search: true

# Site footer, shown on every page (both fields allow inline HTML/links).
footer:
  message: Guide to the TermX terminology, wiki &amp; modelling platform
  copyright: >-
    © 2026 <a href="https://termx.org">TermX</a> · Built with
    <a href="https://github.com/igorboss/mdbook">mdbook</a>
